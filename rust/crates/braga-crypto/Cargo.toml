[package]
name = "braga-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
bcrypt = "0.15"
unicode-normalization = "0.1"
thiserror = "1.0"
subtle = "2.5"
regex = "1.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
