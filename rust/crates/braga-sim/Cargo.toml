[package]
name = "braga-sim"
version.workspace = true
edition.workspace = true

[dependencies]
braga-contracts = { path = "../braga-contracts" }
braga-crypto = { path = "../braga-crypto" }
braga-identity = { path = "../braga-identity" }
braga-limiter = { path = "../braga-limiter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt", "macros", "time"] }
