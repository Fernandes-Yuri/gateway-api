# Braga Saúde Gateway - Cerca Elétrica (Linter)
target-version = "py311"
line-length = 120

[lint]
# Cerca elétrica: previne dead code, imports e variáveis não utilizadas e erros sintáticos
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501",  # line length (formatação livre)
    "E402",  # module import not at top of file
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable name
]
