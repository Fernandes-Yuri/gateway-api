version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bragasaude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bragasaude
      POSTGRES_USER: bragasaude_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro
      - ../../migrations/016_clinical_references_sources.sql:/docker-entrypoint-initdb.d/016_clinical_references_sources.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bragasaude_user -d bragasaude"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
