[pytest]
# Suporte a testes async (security_defense, feedback_replies, assistant_preferences).
# Os testes do gateway usam `async def test_*` soltos; sem esta opcao o pytest
# os pula com "async def functions are not natively supported".
asyncio_mode = auto
# Diretorio raiz dos testes (server/).
testpaths = .
python_files = test_*.py
