name: Contratos WhatsApp Yuri
on:
  pull_request:
    paths:
      - 'scripts/server/**'
      - 'migrations/**'
      - 'docs/contracts/whatsapp-*.md'
      - 'docs/prompts/**'
      - '.github/workflows/whatsapp-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: braga_privacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/braga_privacy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Contratos e concorrência em PostgreSQL
        run: >-
          python -m pytest -q scripts/server/test_whatsapp_intake.py
          scripts/server/test_whatsapp_intake_postgres.py
          scripts/server/test_channel_retirement.py
          scripts/server/test_channel_retirement_postgres.py
      - name: Confere OpenAPI versionado
        run: python scripts/export_whatsapp_contract.py --check
