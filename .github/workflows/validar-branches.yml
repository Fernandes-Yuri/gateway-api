name: Validar alterações
on:
  push:
    branches: ['master', 'feat/**', 'fix/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: braga_privacy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d braga_privacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/braga_privacy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      # DT-015: CI instala o MESMO lock com hashes que o deploy da EC2.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check scripts/server/ scripts/ migrate.py
      - run: python -m unittest discover scripts/server/ "test_*.py"
      - name: Validar catálogo e curadoria em PostgreSQL
        run: PYTHONPATH=.:scripts/server python -m pytest -q scripts/server/test_grocery_cards.py scripts/server/test_grocery_basket.py scripts/server/test_grocery_nutrition_reference.py scripts/server/test_grocery_retail_admin.py scripts/server/test_grocery_retail_postgres.py scripts/server/test_grocery_curation_postgres.py
      - run: PYTHONPATH=scripts/server python -m unittest discover research/ "test_*.py"

  ensaio-migracoes:
    # DT-004: runner real (migrate.py) em banco efêmero, do baseline
    # publicado ao snapshot atual, com dados sintéticos e falha deliberada.
    uses: ./.github/workflows/ensaio-migracoes.yml
