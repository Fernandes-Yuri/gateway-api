name: Validar alterações
on:
  push:
    branches: ['master', 'feat/**', 'fix/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: braga_privacy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d braga_privacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/braga_privacy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check scripts/server/
      - run: python -m unittest discover scripts/server/ "test_*.py"
      - run: PYTHONPATH=scripts/server python -m unittest discover research/ "test_*.py"
