name: Deploy to EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/braga-gateway

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Activate venv and install dependencies
            source venv/bin/activate
            pip install -r app/requirements.txt 2>/dev/null || echo "No requirements.txt, skipping"

            # Restart the service
            sudo systemctl restart braga-gateway.service
            sleep 2
            sudo systemctl status braga-gateway.service --no-pager
