name: Deploy to EC2

on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: braga_privacy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d braga_privacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/braga_privacy_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements*.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # DT-015: mesmo lock com hashes que o deploy da EC2 (runtime)
          # mais ferramentas de lint/teste desta etapa de CI.
          pip install --require-hashes -r requirements-dev.lock

      - name: Lint with Ruff
        run: |
          ruff check scripts/server/ scripts/ migrate.py

      - name: Run unit tests
        run: |
          python -m unittest discover scripts/server/ "test_*.py"
          PYTHONPATH=.:scripts/server python -m pytest -q scripts/server/test_grocery_editorial.py scripts/server/test_grocery_editorial_postgres.py scripts/server/test_grocery_publications.py scripts/server/test_grocery_cards.py scripts/server/test_grocery_retail_admin.py scripts/server/test_basket_comparison.py

      - name: Run research tests
        run: |
          PYTHONPATH=scripts/server python -m unittest discover research/ "test_*.py"

  ensaio-migracoes:
    # DT-004: gate do deploy. Uma migration quebrada reprova aqui antes de
    # qualquer comando SSM tocar a EC2 (deploy.sh roda com set -e).
    uses: ./.github/workflows/ensaio-migracoes.yml

  deploy:
    needs: [lint-and-test, ensaio-migracoes]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy via AWS SSM Run Command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Disparando deploy na EC2 via AWS SSM..."
          cat << EOF > /tmp/ssm_params.json
          {
            "commands": [
              "runuser -u ec2-user -- git -C /home/ec2-user/braga-gateway remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Fernandes-Yuri/gateway-api.git",
              "runuser -u ec2-user -- git -C /home/ec2-user/braga-gateway fetch origin ${REF_NAME}",
              "runuser -u ec2-user -- git -C /home/ec2-user/braga-gateway reset --hard origin/${REF_NAME}",
              "runuser -u ec2-user -- git -C /home/ec2-user/braga-gateway remote set-url origin git@github.com:Fernandes-Yuri/gateway-api.git",
              "runuser -u ec2-user -- bash /home/ec2-user/braga-gateway/deploy.sh"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04728dd8094ed0e78" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_params.json \
            --query "Command.CommandId" \
            --output text)
          rm -f /tmp/ssm_params.json

          echo "Comando SSM disparado com ID: $COMMAND_ID"
          echo "Aguardando conclusao do script de deploy..."

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-04728dd8094ed0e78" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-04728dd8094ed0e78" --query "Status" --output text)
          echo "Status final: $STATUS"

          echo "=== SAIDA PADRAO (STDOUT) ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-04728dd8094ed0e78" --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== ERRO (STDERR) ==="
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-04728dd8094ed0e78" --query "StandardErrorContent" --output text
            exit 1
          fi
