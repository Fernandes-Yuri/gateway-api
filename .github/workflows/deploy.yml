name: Deploy to EC2

on:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check scripts/server/

      - name: Run unit tests
        run: |
          python -m unittest discover scripts/server/ "test_*.py"

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/braga-gateway
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fernandes-Yuri/gateway-api.git
            git fetch origin master
            git reset --hard origin/master
            git remote set-url origin git@github.com:Fernandes-Yuri/gateway-api.git
            bash deploy.sh
