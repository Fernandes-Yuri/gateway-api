name: Deploy to EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/braga-gateway
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fernandes-Yuri/gateway-api.git
            git fetch origin master
            git reset --hard origin/master
            git remote set-url origin git@github.com:Fernandes-Yuri/gateway-api.git
            bash deploy.sh

